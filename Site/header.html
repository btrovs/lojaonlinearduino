<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja Arduino Belém</title>
<link rel="stylesheet" href="header.css">
</head>
<body>

<header class="topo">
    <div class="bemvindo">
        <p>Bem Vindo(a) à Loja Arduino Belém</p>
    </div>

    <div class="cabecalho">
        <img src="Imagens/logo.png" alt="Logo da Loja Arduino Amazônia" class="logo">

        <div class="barra-pesquisa">
            <button class="menu-btn">&#9776;</button>
            <input type="text" placeholder="Procure por Produtos">
            <select>
                <option>Todas as categorias</option>
                <option>Componentes</option>
                <option>Sensores</option>
                <option>Placas Arduino</option>
            </select>
            <button class="search-btn">🔍</button>
        </div>

        <div class="acoes">
            <a href="#">🛍 Loja</a>
            <span>|</span>
            <a href="#">👤 Minha Conta</a>
        </div>

        <div class="carrinho">
            <span class="icon">🛒</span>
            <span class="valor">R$0,00</span>
            <span class="quantidade">0</span>
        </div>
    </div>
</header>

</body>
</html>
